schema_version: "0.1"

id: EXP-001
name: "PuLID Re-Aging Stress Test"
state: DESIGNED

source_research:
  artifacts:
    - DA-004
  source_chat: "Deep Analysis 04 — PuLID"
  source_issue: null

research_finding: >
  PuLID is a strong identity-conditioning architecture candidate for Stage A,
  but Re-Aging-specific evidence is still required to determine whether strong
  identity conditioning suppresses legitimate age transformation.

objective: >
  Measure the Identity–Age trade-off of stock PuLID under progressively larger
  Re-Aging transformations and determine whether it should be promoted,
  modified with Age-Aware Identity Conditioning, or downgraded to an
  architecture reference.

hypotheses:
  H1: >
    Increasing identity conditioning strength may improve identity similarity
    while suppressing realized age transformation.
  H2: >
    Earlier or stronger identity injection may improve identity preservation
    while reducing age editability.
  H3: >
    Rich visual identity features may carry more source-age appearance than
    biometric identity features.

