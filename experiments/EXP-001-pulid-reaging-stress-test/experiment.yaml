implementation_handoff:
  remaining_to_reach_executable:
    - "Acquire AgeDB under its non-commercial research terms, materialize the private 8-row manifest, and commit only its license-safe lock/hash record."
    - "Materialize and verify checkpoint_manifest.lock.yaml for FLUX/AE/PuLID, local T5/CLIP snapshots, PuLID auxiliary identity/preprocessing assets, AdaFace, MiVOLO, and the MiVOLO detector."
    - "Environment gate complete: four isolated Windows environments verified and resolved locks committed."
    - "Run manifest validation and a 1-source generation/evaluation smoke test."
    - "Verify output naming, raw manifest, deterministic seeds, evaluator success, and paired metric aggregation."
    - "Record exact sai-reaging project commit and observed hardware."
  separate_follow_up_if_needed:
    H3: >
      If Phase A shows age suppression worth investigating, create an
      Implementation task to expose/ablate biometric vs rich visual identity
      contributions. Do not fold that architecture change into Phase A.

